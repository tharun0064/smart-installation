[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nr-diagnose"
version = "0.1.0"
description = "Intelligent CLI diagnostics for New Relic agent installations"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "anthropic>=0.25.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
nr-diagnose = "nr_diagnose.cli:main"

[tool.setuptools.packages.find]
include = ["nr_diagnose*"]
