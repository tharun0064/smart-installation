# ─── DETERMINISTIC ROUTING (overrides LLM if it drifts) ───
# When the original failure's stderr matches any of these patterns, the runner
# enforces that bad_inputs contains the listed names — overriding the LLM if
# it tried to flag something else. Prevents the "ORA-01017 → endpoint is wrong"
# misdiagnosis that prompts alone don't reliably prevent.
error_code_routing:
  - patterns: ["ORA-01017"]
    bad_inputs: [ORACLE_USERNAME, ORACLE_PASSWORD]
    root_cause: "Oracle returned ORA-01017 — the user-supplied ORACLE_USERNAME and/or ORACLE_PASSWORD is incorrect (or the account is locked/expired)."
    explanation: "The collector connected to Oracle at the network level but credentials were rejected during authentication. Re-prompt for both username and password."

  - patterns: ["ORA-12514"]
    bad_inputs: [ORACLE_SERVICE]
    root_cause: "Oracle listener does not recognize the service name in the connection string (ORA-12514). Common typo: FREEDB1 vs FREEPDB1, XEPDB1 vs ORCLPDB1."
    explanation: "The listener at ORACLE_HOST:ORACLE_PORT is up, but it has no service registered with the supplied ORACLE_SERVICE name. Re-prompt for the correct service."

  - patterns: ["ORA-12541", "ORA-12545"]
    bad_inputs: [ORACLE_HOST, ORACLE_PORT]
    root_cause: "Cannot reach the Oracle listener (ORA-1254x). Either the host doesn't resolve / has no route, or no listener is on the configured port."
    explanation: "Re-prompt for ORACLE_HOST and ORACLE_PORT. Inside Docker compose, ORACLE_HOST should be the service name, not 'localhost'."

  - patterns: ["401 Unauthorized", "403 Forbidden", "PermissionDenied", "status 401", "status 403"]
    bad_inputs: [NEW_RELIC_LICENSE_KEY]
    root_cause: "New Relic rejected the OTLP request with HTTP 401/403 — the NEW_RELIC_LICENSE_KEY is invalid, of the wrong type (must be 'Ingest – License'), or doesn't belong to the region of NEW_RELIC_OTLP_ENDPOINT."
    explanation: "Re-prompt for the license key. If the key is correct, also verify NEW_RELIC_OTLP_ENDPOINT matches the region (US / EU / staging)."

priority_commands:
  # Oracle reachable at TCP level (replaces ping — ICMP isn't needed and is often blocked in containers)
  - nc -zv ${ORACLE_HOST} ${ORACLE_PORT}
  # Collector config is structurally valid
  - /usr/local/bin/otelcol-contrib validate --config=/etc/otelcol-contrib/config.yaml
  # Show rendered config and host arch when something needs diagnosing
  - cat /etc/otelcol-contrib/config.yaml
  - uname -m
  # NR endpoint is reachable (this is reachability only, not auth — the install's step 11 catches auth)
  - curl -fsS -o /dev/null -w "HTTP %{http_code}\n" https://otlp.nr-data.net || true

context_hints:
  # ─── ERROR-CODE → INPUT-NAME ROUTING (use these to populate bad_inputs) ───
  - "ORA-01017 in stderr ⇒ ORACLE_USERNAME and/or ORACLE_PASSWORD is wrong. Flag BOTH in bad_inputs. DO NOT look at the OTLP endpoint — this error is purely about Oracle authentication."
  - "ORA-12514 in stderr ⇒ ORACLE_SERVICE is wrong (typo, like FREEDB1 vs FREEPDB1). Flag ORACLE_SERVICE in bad_inputs."
  - "ORA-12541 or ORA-12545 in stderr ⇒ ORACLE_HOST or ORACLE_PORT is wrong. Flag both in bad_inputs."
  - "ORA-00942 in stderr ⇒ The ORACLE_USERNAME lacks SELECT privileges on V$ views. This is a database GRANT issue, not a wrong-input issue — leave bad_inputs empty and suggest running 'GRANT SELECT ANY DICTIONARY TO <user>' as SYSDBA."
  - "HTTP 401 or 403 from otlp.nr-data.net or any otlp.* endpoint ⇒ NEW_RELIC_LICENSE_KEY is wrong (or doesn't match the region). Flag NEW_RELIC_LICENSE_KEY in bad_inputs."
  - "DNS resolution failure (NXDOMAIN, 'name or service not known') for an otlp.* hostname ⇒ NEW_RELIC_OTLP_ENDPOINT is wrong. Flag NEW_RELIC_OTLP_ENDPOINT in bad_inputs."
  # ─── ANTI-DRIFT RULES ───
  - "Stay anchored to the SPECIFIC error in stderr. If stderr contains an Oracle ORA-XXXXX code, your diagnostic commands and root cause MUST address Oracle. Do NOT grep the OTLP endpoint and run network checks against it — that's a different subsystem."
  - "If stderr contains an OTLP/NR error (HTTP 4xx, 'PermissionDenied', certificate issue), focus on the OTLP exporter section — do NOT diagnose Oracle."
  # ─── DOMAIN ───
  - "/etc/otelcol-contrib/config.yaml is generated by step 9 (bash heredoc) from the user's input values. Whatever appears in that file IS the user's input, already substituted. Don't call it 'hardcoded' — say 'wrong user-supplied value' and list the inputs in bad_inputs."
  - "If port 1521 is unreachable, check Docker network connectivity between containers."
  - "If config validation fails, check YAML indentation (must be 2 spaces, no tabs)."
  - "If architecture mismatch, download arm64 variant for aarch64 systems."
  - "Collector stderr/log shows all connection attempts and ORA codes — read it carefully."
